    const k = el.getAttribute('data-panetitle');
    if (d.tabs && d.tabs[k]) el.textContent = d.tabs[k];
  });

  const flags = document.getElementById('flagContainer');
  if (flags) flags.innerHTML = flagSVGs[lang] || '';
}

function updateDesign() {
  const gv = (id, fb) => { const el = document.getElementById(id); return el ? el.value : fb; };

  const borderEl = document.getElementById('borderToggle');
  const borderWidth = (borderEl && !borderEl.checked) ? 0 : 30;
  const theme = gv('themeInput', 'custom');
  const font = gv('fontInput', "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif");
  const fontSize = gv('fontSizeInput', 26);

  const sizeOut = document.getElementById('fontSizeDisplay');
  if (sizeOut) sizeOut.textContent = fontSize;

  const pageEl = document.getElementById('printableArea');
  if (pageEl) {
    pageEl.style.padding = borderWidth + 'px';
    pageEl.style.background = themes[theme];
    pageEl.style.fontFamily = font;
  }

  const grid = document.getElementById('mathGrid');
  if (grid) grid.style.setProperty('--qfs', fontSize + 'px');
  fitQuestions();

  syncSwatches();
  saveState();
}

/* Your font size is a ceiling, not a fixed value.
   Grid tracks are now minmax(0,1fr), so a question can no longer widen its
   own column; it overflows inside the cell instead, which is measurable.
   Step the type down until nothing overflows horizontally or vertically.
   On a default sheet this loop exits immediately and changes nothing. */
const QFS_FLOOR = 13;

/* ===========================================================
   BATCH
   Scores a configuration without rendering it, so a few hundred can be
   tried in the time one sheet takes to draw. Same formula as the live
   rating, with the kinds counted from the deck rather than from the
   twenty drawn - which is what makes it deterministic.
   =========================================================== */
function estimateScore(setToggles, setLevels) {
  const savedT = { ...activeToggles };
  const savedL = { ...opLevel };
  Object.keys(activeToggles).forEach(k => activeToggles[k] = false);
  Object.keys(opLevel).forEach(k => opLevel[k] = 0);
  Object.assign(activeToggles, setToggles);
  Object.assign(opLevel, setLevels || {});
  applyLevels();

  const num = (id, fb) => {
    const el = document.getElementById(id);
    if (!el || el.value === '') return fb;
    const v = parseInt(el.value, 10);
    return Number.isNaN(v) ? fb : v;
  };
  let opMin = num('minInput', 0), opMax = num('maxInput', 20);
  if (opMin > opMax) [opMin, opMax] = [opMax, opMin];
  let ansMin = num('answerMinInput', 0), ansMax = num('answerMaxInput', 20);
  if (ansMin > ansMax) [ansMin, ansMax] = [ansMax, ansMin];

  const deck = generateDeck(opMin, opMax, ansMin, ansMax);
  const mean = scoreDeck(deck).score;

  Object.assign(activeToggles, savedT);
  Object.assign(opLevel, savedL);
  applyLevels();
  return { score: mean, stars: starsFromScore(mean), deck: deck.length };
}

/* What the batch is allowed to draw from: whatever is switched on right now.
   If she is not doing division this week, no sheet in the batch will contain
   any. Selecting four types does not mean every sheet carries all four - it
   means those four are the pool, used alone or in combination. */
function currentSelection() {
  const plain = ['add', 'sub', 'mult', 'div', 'alg', 'missop', 'balance', 'partition', 'fracof']
    .filter(k => activeToggles[k]);
  const levels = { comp: opLevel.comp || 0, seq: opLevel.seq || 0 };
  if (!plain.length && !levels.comp && !levels.seq) plain.push('add');
  return { plain, levels };
}

/* Every combination of the selected types, scored once. A levelled type that
   is on at level 2 may also appear at level 1, being the easier form of the
   same exercise. The space is small enough to enumerate outright unless a lot
   is selected, in which case it is sampled. */
function buildCatalogue(sel) {
  sel = sel || currentSelection();
  const plain = sel.plain;
  const combos = [];

  const compMax = sel.levels.comp || 0;
  const seqMax = sel.levels.seq || 0;

  for (let mask = 0; mask < (1 << plain.length); mask++) {
    for (let c = 0; c <= compMax; c++) {
      for (let q = 0; q <= seqMax; q++) {
        const toggles = {};
        const chosen = [];
        plain.forEach((k, i) => { if (mask & (1 << i)) { toggles[k] = true; chosen.push(k); } });
        if (!chosen.length && !c && !q) continue;
        combos.push({ toggles, levels: { comp: c, seq: q }, key: chosen.join(',') + '|' + c + q });
      }
    }
  }

  /* Too many to score one by one, so sample - but never drop the simple ones.
     A single exercise on its own is what anchors the low end of the range, and
     losing it to a random sample made 1 star unreachable now and then. */
  const LIMIT = 1200;
  if (combos.length > LIMIT) {
    const simple = combos.filter(c => c.key.split('|')[0].split(',').filter(Boolean).length <= 1);
    const rest = combos.filter(c => c.key.split('|')[0].split(',').filter(Boolean).length > 1);
    for (let i = rest.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [rest[i], rest[j]] = [rest[j], rest[i]];
    }
    combos.length = 0;
    combos.push(...simple, ...rest.slice(0, Math.max(0, LIMIT - simple.length)));
  }

  const out = [];
  combos.forEach(c => {
    const r = estimateScore(c.toggles, c.levels);
    if (r.deck < 40) return;              // too few questions to fill a sheet
    out.push({ toggles: c.toggles, levels: c.levels, score: r.score, stars: r.stars, key: c.key });
  });
  return out;
}

/* A stored ZIP, written by hand. PNGs do not compress, so there is nothing to
   gain from deflate and nothing to load from a CDN - which matters, since the
   network is not always there. */
function crc32(buf) {
  let c, table = crc32.table;
  if (!table) {
    table = crc32.table = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) crc = table[(crc ^ buf[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function makeZip(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;

  const u16 = v => [v & 255, (v >>> 8) & 255];
  const u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];

  files.forEach(f => {
    const name = enc.encode(f.name);
    const crc = crc32(f.data);
    const local = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0),
      ...u16(0), ...u16(0), ...u32(crc), ...u32(f.data.length), ...u32(f.data.length),
      ...u16(name.length), ...u16(0), ...name]);
    chunks.push(local, f.data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0),
      ...u16(0), ...u16(0), ...u32(crc), ...u32(f.data.length), ...u32(f.data.length),
      ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset), ...name]));
    offset += local.length + f.data.length;
  });

  const centralSize = central.reduce((n, c) => n + c.length, 0);
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(files.length), ...u16(files.length), ...u32(centralSize), ...u32(offset), ...u16(0)]);

  const total = chunks.reduce((n, c) => n + c.length, 0) + centralSize + end.length;
  const out = new Uint8Array(total);
  let p = 0;
  chunks.forEach(c => { out.set(c, p); p += c.length; });
  central.forEach(c => { out.set(c, p); p += c.length; });
  out.set(end, p);
  return out;
}

/* One pencil per answer box, placed in the sheet's own coordinates so the
   preview zoom cannot move them. Recomputed after every fit, since the box
   size follows the type size. */
function placePencils() {
  const layer = document.getElementById('pencilLayer');
  const content = document.querySelector('.content');
  const pageEl = document.getElementById('printableArea');
  const grid = document.getElementById('mathGrid');
  if (!layer || !content || !pageEl || !grid) return;

  const k = (pageEl.getBoundingClientRect().width / pageEl.offsetWidth) || 1;
  const c = content.getBoundingClientRect();
  const boxes = [...grid.querySelectorAll('.answer-box')];

  while (layer.children.length > boxes.length) layer.lastChild.remove();
  while (layer.children.length < boxes.length) {
    const img = document.createElement('img');
    img.className = 'pencil-svg';
    img.alt = '';
    img.src = PENCIL_SRC;
    layer.appendChild(img);
  }

  const size = parseFloat(grid.style.getPropertyValue('--qfs')) || 26;
  boxes.forEach((b, i) => {
    const r = b.getBoundingClientRect();
    const pen = layer.children[i];
    if (!pen) return;
    // the tip sits at (14,150) of a 170 square, so back that out of the corner
    const w = size * 2.55;
    pen.style.left = ((r.right - c.left) / k - size * 0.62 - w * (14 / PENCIL_W)) + 'px';
    pen.style.top  = ((r.top  - c.top)  / k + size * 0.58 - w * (150 / PENCIL_H)) + 'px';
  });
}

function fitQuestions() {
  const grid = document.getElementById('mathGrid');
  const content = document.querySelector('.content');
  const sizeEl = document.getElementById('fontSizeInput');
  if (!grid || !content || !sizeEl) return;

  const requested = parseFloat(sizeEl.value) || 26;
  let size = requested;
  grid.style.setProperty('--qfs', size + 'px');

  const questions = () => [...grid.querySelectorAll('.question')];
  const tooWide = () => questions().some(q => q.scrollWidth > q.clientWidth + 0.5);
  /* The grid carries min-height:0 so the footer can stay pinned, which also
     means it shrinks below its own content instead of pushing .content out.
     Checking .content alone therefore reports no overflow while questions are
     quietly running over the header and the hint. Both boxes get measured. */
  const tooTall = () => content.scrollHeight > content.clientHeight + 0.5
                     || grid.scrollHeight > grid.clientHeight + 0.5;

  // one estimate jump, then verify. Everything in a question scales off --qfs,
  // so the worst ratio is a good first guess rather than 26 single steps.
  let worstRatio = 1;
  questions().forEach(q => {
    if (q.scrollWidth > q.clientWidth + 0.5) worstRatio = Math.min(worstRatio, q.clientWidth / q.scrollWidth);
  });
  if (worstRatio < 1) {
    size = Math.max(QFS_FLOOR, Math.floor(requested * worstRatio));
    grid.style.setProperty('--qfs', size + 'px');
  }

  let guard = 0;
  while (size > QFS_FLOOR && guard++ < 60 && (tooWide() || tooTall())) {
    size -= 1;
    grid.style.setProperty('--qfs', size + 'px');
  }
  // the estimate can undershoot; give back any pixels that still fit
  while (size < requested && guard++ < 60) {
    grid.style.setProperty('--qfs', (size + 1) + 'px');
    if (tooWide() || tooTall()) { grid.style.setProperty('--qfs', size + 'px'); break; }
    size += 1;
  }

  placePencils();

  const warn = document.getElementById('fitWarn');
  const warnText = document.getElementById('fitWarnText');
  if (warn && warnText) {
    if (size < requested) {
      const langEl = document.getElementById('langInput');
      const d = i18n[langEl ? langEl.value : DEFAULT_LANG];
      const tpl = (d && d.warn_fit) ? d.warn_fit : 'Text shrunk to {n}px so all 20 questions fit the page.';
      warnText.textContent = tpl.replace('{n}', size);
      warn.hidden = false;
    } else {
      warn.hidden = true;
    }
  }
}

/* ===========================================================
   7. QUESTION LOGIC  -  carried over from v000 unchanged.
   =========================================================== */
function formatNum(num) { return num < 0 ? `(${num})` : num; }

/* ===========================================================
   DIFFICULTY
   The rating describes the questions on the page, not which boxes are
   ticked. Weighting is deliberately lopsided: what kind of thinking a
   question demands counts for most of it, and how big the numbers are
   counts for very little and stops counting entirely past a ceiling.
   Grinding 400 + 300 should not out-score a balanced equation.
   =========================================================== */
const DIFF_BASE = {
  comp: 0.90,        // reading two numbers and saying which is bigger
  add: 1.00,         // the baseline everything else is measured against
  sub: 1.15,         // the same, with borrowing in play
  partition: 1.35,   // near-automatic once place value has landed
  missop: 1.60,      // between two signs it is a guess and a check; see candidates below
  seq: 1.70,         // find the step, apply it once
  mult: 1.75,
  alg: 1.95,         // needs the inverse operation, not a second guess
  div: 2.05,
  fracof: 2.15,      // division wearing a different hat
  comp_hard: 2.45,   // two sums, then a judgement
  seq_hard: 2.55,    // find the step, then work backwards into the gap
  balance: 2.95      // the hardest single idea here
};

// magnitude is worth at most 0.5, however large the numbers get
function magBonus(nums) {
  const m = Math.max(...nums.map(n => Math.abs(n)));
  return m > 100 ? 0.50 : m > 50 ? 0.40 : m > 20 ? 0.28 : m > 10 ? 0.15 : 0;
}

// carrying or borrowing across a ten is a real step up at this age
function crossesTen(a, b, op) {
  if (op === '+') return (Math.abs(a) % 10) + (Math.abs(b) % 10) >= 10;
  if (op === '-') return (Math.abs(a) % 10) < (Math.abs(b) % 10);
  return false;
}

const DIFF_FLOOR = 1.18, DIFF_CEIL = 3.25;  // floor set from a measured easy sheet, not guessed

function starsFromScore(mean) {
  const scaled = 1 + 5 * (mean - DIFF_FLOOR) / (DIFF_CEIL - DIFF_FLOOR);
  return Math.max(1, Math.min(6, Math.round(scaled * 2) / 2));
}

/* The one place a deck turns into a number. Averaged per kind, then across the
   kinds in the proportions the round-robin draw will use, plus the variety
   bonus. Both the live rating and the batch's estimate call this, so they
   cannot drift apart. */
function scoreDeck(deck) {
  const perCat = {};
  for (let i = 0; i < deck.length; i++) {
    const c = deck[i].category;
    if (!perCat[c]) perCat[c] = { sum: 0, n: 0 };
    perCat[c].sum += cardDifficulty(deck[i]);
    perCat[c].n++;
  }
  const names = Object.keys(perCat);
  if (!names.length) return { score: 1, kinds: 1 };

  const share = {};
  let left = 20;
  while (left > 0) {
    let any = false;
    for (const c of names) {
      if (left <= 0) break;
      if ((share[c] || 0) < perCat[c].n) { share[c] = (share[c] || 0) + 1; left--; any = true; }
    }
    if (!any) break;
  }

  let total = 0, weighted = 0;
  names.forEach(c => {
    const w = share[c] || 0;
    weighted += (perCat[c].sum / perCat[c].n) * w;
    total += w;
  });
  let score = total ? weighted / total : 1;
  /* Breadth is the route to the top. 0.18 a kind capped at 0.90 means twenty
     of one format tops out at 5.5 however hard that format is, and six stars
     needs at least four different exercises on one page. */
  score += Math.min(0.90, 0.18 * Math.max(0, names.length - 1));
  return { score, kinds: names.length };
}

function cardDifficulty(card) {
  let d = DIFF_BASE[card.category] || 1;
  const nums = (card.terms || [card.a, card.b, card.res, card.leftVal, card.rightVal])
    .filter(n => typeof n === 'number');
  if (nums.length) d += magBonus(nums);
  if (card.op && crossesTen(card.a, card.b, card.op)) d += 0.35;
  if (typeof card.res === 'number' && card.res < 0) d += 0.70;
  if (card.a < 0 || card.b < 0) d += 0.90;
  // a missing sign among four operations is a real search; among two it is a coin flip
  if (card.candidates > 2) d += 0.35 * (card.candidates - 2);
  return d;
}

/* The operator is always wrapped in the same markup; only a class on the
   sheet decides whether it is coloured. That way switching the colours on or
   off cannot change the layout and does not need new questions. */
function getColoredOp(op) {
  const key = op === '+' ? 'add' : op === '-' ? 'sub' : op === 'x' ? 'mult' : op === '\u00f7' ? 'div' : null;
  if (!key) return op;
  return `<span class="opsign os-${key}">${op}</span>`;
}

function applySigns() {
  const el = document.getElementById('colorSignsToggle');
  const content = document.querySelector('.content');
  if (content) content.classList.toggle('signs-on', !!(el && el.checked));
}

function toggleSigns() {
  applySigns();
  saveState();
}

function generateDeck(opMin, opMax, ansMin, ansMax) {
  let deck = [];
  let exprs = [];
  let lockNum = document.getElementById('lockInput').value;

  let hasStandard = activeToggles.add || activeToggles.sub || activeToggles.mult || activeToggles.div;
  let hasAlg = activeToggles.alg;
  let hasComp = activeToggles.comp;
  let hasCompHard = activeToggles.comp_hard;
  let hasMissOp = activeToggles.missop;
  let hasSeq = activeToggles.seq || activeToggles.seq_hard;
  const hasBalance = activeToggles.balance;
  const hasPartition = activeToggles.partition;
  const hasFracOf = activeToggles.fracof;
  const seqAnywhere = activeToggles.seq_hard;

  // optional pin: only keep cards whose result equals this. Turns missing-number
  // questions into number bonds - 7 + [ ] = 10 - with no new question type.
  const lockAnsEl = document.getElementById('lockAnswerInput');
  const lockAns = (lockAnsEl && lockAnsEl.value !== '') ? parseInt(lockAnsEl.value, 10) : null;
  const lockOK = res => lockAns === null || Number.isNaN(lockAns) || res === lockAns;

  let ops = [];
  if (activeToggles.add) ops.push('+');
  if (activeToggles.sub) ops.push('-');
  if (activeToggles.mult) ops.push('x');
  if (activeToggles.div) ops.push('÷');

  if (!hasStandard && !hasAlg && !hasComp && !hasCompHard && !hasMissOp && !hasSeq
      && !hasBalance && !hasPartition && !hasFracOf) {
    hasStandard = true;
    ops.push('+');
  } else if ((hasStandard || hasAlg || hasCompHard || hasMissOp) && ops.length === 0) {
    ops.push('+');
  }

  // Four explicit bounds. Operands live in [opMin, opMax], results in
  // [ansMin, ansMax]. Keeping the pairs apart is what makes real times
  // tables possible: numbers 0 to 12, answers 0 to 144. Setting either
  // lower bound below zero is what used to be the negatives switch.
  const minBound = opMin;

  /* The deck is a cross-product, so walking every value is quadratic: a range
     of 1000 is a million pairs per operation. Past a threshold we step through
     the range instead, with a random offset so different sheets land on
     different values and the whole range still gets used. */
  const span = opMax - opMin + 1;
  const SAMPLE_AT = 140;
  const stride = span > SAMPLE_AT ? Math.ceil(span / SAMPLE_AT) : 1;
  const jitter = stride > 1 ? Math.floor(Math.random() * stride) : 0;
  const from = opMin + jitter;

  for (let a = from; a <= opMax; a += stride) {
    for (let b = from; b <= opMax; b += stride) {
      if (lockNum !== "") {
        let num = parseInt(lockNum);
        if (a !== num && b !== num) continue;
      }
      ops.forEach(op => {
        let res;
        if (op === '+') res = a + b;
        if (op === '-') res = a - b;
        if (op === 'x') res = a * b;
        if (op === '÷') {
          if (b === 0 || a % b !== 0) return;
          res = a / b;
        }
        if (res >= ansMin && res <= ansMax) {
          let styledOp = getColoredOp(op);
          // value is carried so a compare card can state its own answer later
          exprs.push({ text: `${formatNum(a)} ${styledOp} ${formatNum(b)}`, value: res });
          let cat = op === '+' ? 'add' : op === '-' ? 'sub' : op === 'x' ? 'mult' : 'div';
          if (hasStandard && lockOK(res)) deck.push({ a, op, b, res, format: 'standard', category: cat });
          if (hasAlg && lockOK(res)) deck.push({ a, op, b, res, format: 'algebra', category: 'alg' });

        }
      });
    }
  }

  if (hasComp || hasCompHard) {
    for (let a = from; a <= opMax; a += stride) {
      for (let b = from; b <= opMax; b += stride) {
        if (lockNum !== "") {
          let num = parseInt(lockNum);
          if (a !== num && b !== num) continue;
        }
        if (hasComp) {
          deck.push({ leftText: formatNum(a), rightText: formatNum(b),
                      leftVal: a, rightVal: b, format: 'compare', category: 'comp' });
        }
        if (hasCompHard && exprs.length > 0) {
          /* Paired from the operands rather than at random. A random deck makes
             the sheet's own rating wobble between draws with identical settings,
             and makes the batch's estimate disagree with what it then renders.
             The spread is just as varied; it is simply reproducible. */
          const pick = (n) => exprs[Math.abs(n) % exprs.length];
          let e1 = pick(a * 31 + b * 17 + 7);
          let e2 = pick(a * 13 + b * 29 + 3);
          let rand = ((Math.abs(a * 7 + b * 11)) % 3) / 3;
          if (rand < 0.33) {
            deck.push({ leftText: e1.text, rightText: formatNum(b),
                        leftVal: e1.value, rightVal: b, format: 'compare', category: 'comp_hard' });
          } else if (rand < 0.66) {
            deck.push({ leftText: formatNum(a), rightText: e2.text,
                        leftVal: a, rightVal: e2.value, format: 'compare', category: 'comp_hard' });
          } else {
            deck.push({ leftText: e1.text, rightText: e2.text,
                        leftVal: e1.value, rightVal: e2.value, format: 'compare', category: 'comp_hard' });
          }
        }
      }
    }
  }

  if (hasSeq) {
    // three terms shown, one blank. Every term must sit inside the operand
    // range, so a sequence never runs past what the sheet allows.
    const span = opMax - opMin;
    const maxStep = Math.max(1, Math.min(12, Math.floor(span / 3) || 1));
    for (let start = from; start <= opMax; start += stride) {
      for (let step = -maxStep; step <= maxStep; step++) {
        if (step === 0) continue;
        const terms = [start, start + step, start + 2 * step, start + 3 * step];
        if (terms.some(t => t < opMin || t > opMax)) continue;
        // level 1 always blanks the last term; level 2 blanks any position,
        // which asks her to work backwards from the term after the gap.
        const slots = seqAnywhere ? [0, 1, 2, 3] : [3];
        slots.forEach(bi => {
          if (lockAns !== null && !Number.isNaN(lockAns) && terms[bi] !== lockAns) return;
          deck.push({ terms, blank: bi, res: terms[bi], format: 'sequence',
                      category: seqAnywhere ? 'seq_hard' : 'seq' });
        });
      }
    }
  }

  /* Missing sign needs a real choice, so it runs on its own operator set of at
     least two, and only keeps questions with exactly one correct sign. Without
     that filter you get 2 [ ] 0 = 2, which is true for both plus and minus,
     and x [ ] 1 = x, which is true for times and divide. */
  if (hasMissOp) {
    const missOps = ops.length >= 2 ? ops.slice() : ['+', '-'];
    const applyOp = (x, o, y) => {
      if (o === '+') return x + y;
      if (o === '-') return x - y;
      if (o === 'x') return x * y;
      if (o === '\u00f7') return (y === 0 || x % y !== 0) ? null : x / y;
      return null;
    };
    for (let a = from; a <= opMax; a += stride) {
      for (let b = from; b <= opMax; b += stride) {
        if (lockNum !== "") {
          const num = parseInt(lockNum);
          if (a !== num && b !== num) continue;
        }
        missOps.forEach(op => {
          const res = applyOp(a, op, b);
          if (res === null || res < ansMin || res > ansMax) return;
          if (!lockOK(res)) return;
          /* Exactly one sign in the whole of + - x / may produce this result,
             not just one of the signs in play. 2 [ ] 2 = 4 is true for plus
             and for times, and she has no way of knowing which operators the
             sheet restricted itself to. */
          let hits = 0;
          ['+', '-', 'x', '\u00f7'].forEach(o2 => { if (applyOp(a, o2, b) === res) hits++; });
          if (hits !== 1) return;
          deck.push({ a, op, b, res, format: 'missop', category: 'missop',
                      candidates: missOps.length });
        });
      }
    }
  }

  /* Balancing: 5 + 3 = 4 + [ ]. The point is that '=' means both sides match,
     not 'the answer comes next' - the misconception that quietly breaks
     algebra years later. */
  if (hasBalance) {
    for (let a = Math.max(0, from); a <= opMax; a += stride) {
      for (let b = Math.max(0, from); b <= opMax; b += stride) {
        const sum = a + b;
        if (sum < ansMin || sum > ansMax) continue;
        for (let c = Math.max(1, from); c <= opMax; c += stride) {
          const d = sum - c;
          if (d < Math.max(0, opMin) || d > opMax) continue;
          if (c === a && d === b) continue;          // not a copy of the left side
          if (lockAns !== null && !Number.isNaN(lockAns) && d !== lockAns) continue;
          deck.push({ a, b, c, d, res: d, format: 'balance', category: 'balance' });
        }
      }
    }
  }

  /* Partitioning: 47 = 40 + [ ]. Place value made visible. */
  if (hasPartition) {
    for (let n = Math.max(11, from); n <= opMax; n += stride) {
      const tens = Math.floor(n / 10) * 10;
      const units = n - tens;
      if (!tens) continue;
      [['units', tens, units], ['tens', units, tens]].forEach(([which, shown, missing]) => {
        if (lockAns !== null && !Number.isNaN(lockAns) && missing !== lockAns) return;
        deck.push({ n, shown, res: missing, which, format: 'partition', category: 'partition' });
      });
    }
  }

  /* A fraction of a number: written with the symbol, so it needs no words
     and no translation. Division wearing a different hat. */
  if (hasFracOf) {
    const fracs = [['\u00bd', 2], ['\u00bc', 4], ['\u2153', 3]];
    for (let n = Math.max(2, from); n <= opMax; n += Math.max(1, Math.floor(stride / 2)) ) {
      fracs.forEach(([sym, den]) => {
        if (n % den !== 0) return;
        const r = n / den;
        if (r < 1 || r < ansMin || r > ansMax) return;
        if (lockAns !== null && !Number.isNaN(lockAns) && r !== lockAns) return;
        deck.push({ n, sym, den, res: r, format: 'fracof', category: 'fracof' });
      });
    }
  }

  return deck;
}

function generateSheet() {
  updateText();

  const num = (id, fb) => {
    const el = document.getElementById(id);
    if (!el || el.value === '') return fb;
    const v = parseInt(el.value, 10);
    return Number.isNaN(v) ? fb : v;
  };

  // read, then order the pair so a typo cannot produce an empty deck
  let opMin = num('minInput', 0), opMax = num('maxInput', 20);
  if (opMin > opMax) [opMin, opMax] = [opMax, opMin];
  let ansMin = num('answerMinInput', 0), ansMax = num('answerMaxInput', 20);
  if (ansMin > ansMax) [ansMin, ansMax] = [ansMax, ansMin];

  // the boss star is now earned by letting either range dip below zero
  const allowNeg = opMin < 0 || ansMin < 0;

  let deck = generateDeck(opMin, opMax, ansMin, ansMax);

  let deckByCategory = {};
  deck.forEach(card => {
    if (!deckByCategory[card.category]) deckByCategory[card.category] = [];
    deckByCategory[card.category].push(card);
  });

  let selectedQuestions = [];
  let activeCategories = Object.keys(activeToggles).filter(k => activeToggles[k]);
  if (activeCategories.length === 0) activeCategories = ['add'];

  activeCategories.forEach(cat => {
    if (deckByCategory[cat] && deckByCategory[cat].length > 0) {
      let rIdx = Math.floor(Math.random() * deckByCategory[cat].length);
      selectedQuestions.push(deckByCategory[cat].splice(rIdx, 1)[0]);
    }
  });

  // push(...arr) spreads every element as an argument, so a large deck blows
  // the call stack. concat has no such limit.
  /* Round-robin across the kinds rather than drawing from one shuffled pool.
     Deck sizes are wildly uneven - balancing generates 2870 cards, splitting a
     number generates 20 - so a proportional draw gave 18 additions and 182
     balancings for a sheet that was meant to be a mix of the two. */
  Object.values(deckByCategory).forEach(arr => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  });

  const cats = Object.keys(deckByCategory).filter(c => deckByCategory[c].length);
  let guard = 0;
  while (selectedQuestions.length < 20 && cats.length && guard++ < 400) {
    let took = false;
    for (const c of cats) {
      if (selectedQuestions.length >= 20) break;
      const pool = deckByCategory[c];
      if (pool.length) { selectedQuestions.push(pool.pop()); took = true; }
    }
    if (!took) break;
  }

  for (let i = selectedQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [selectedQuestions[i], selectedQuestions[j]] = [selectedQuestions[j], selectedQuestions[i]];
  }

  const grid = document.getElementById('mathGrid');
  grid.innerHTML = '';

  for (let i = 0; i < selectedQuestions.length; i++) {
    let card = selectedQuestions[i];
    const qDiv = document.createElement('div');
    qDiv.className = 'question';
    // The answer is always written into the box and hidden by CSS. It is
    // absolutely positioned, so showing it cannot change any measurement the
    // autofit depends on.
    // The pencil is deliberately drawn mostly outside the answer box, which is
    // what makes it look like it rests on the corner. html2canvas clips a child
    // to its parent's box whatever `overflow` says, so a pencil parented to the
    // box vanishes from the export. They live in a layer over the whole sheet
    // instead, positioned after layout.
    const box = ans => `<div class="answer-box"><span class="answer-fill">${ans}</span></div>`;

    let answer = '';

    if (card.format === 'compare') {
      answer = card.leftVal > card.rightVal ? '>' : card.leftVal < card.rightVal ? '<' : '=';
      qDiv.innerHTML = `<span style="text-align: right;">${card.leftText}</span> ${box(answer)} <span style="text-align: left;">${card.rightText}</span>`;
    } else if (card.format === 'algebra') {
      let styledOp = getColoredOp(card.op);
      if (Math.random() > 0.5) {
        answer = String(card.a);
        qDiv.innerHTML = `${box(answer)} <span>${styledOp} ${formatNum(card.b)} = ${card.res}</span>`;
      } else {
        answer = String(card.b);
        qDiv.innerHTML = `<span>${formatNum(card.a)} ${styledOp}</span> ${box(answer)} <span>= ${card.res}</span>`;
      }
    } else if (card.format === 'missop') {
      answer = card.op === '-' ? '\u2212' : card.op;
      qDiv.innerHTML = `<span>${formatNum(card.a)}</span> ${box(answer)} <span>${formatNum(card.b)} = ${card.res}</span>`;
    } else if (card.format === 'balance') {
      answer = String(card.d);
      const plus = getColoredOp('+');
      qDiv.innerHTML = `<span>${formatNum(card.a)} ${plus} ${formatNum(card.b)} = ${formatNum(card.c)} ${plus}</span> ${box(answer)}`;
    } else if (card.format === 'partition') {
      answer = String(card.res);
      const plus = getColoredOp('+');
      qDiv.innerHTML = card.which === 'units'
        ? `<span>${card.n} = ${card.shown} ${plus}</span> ${box(answer)}`
        : `<span>${card.n} =</span> ${box(answer)} <span>${plus} ${card.shown}</span>`;
    } else if (card.format === 'fracof') {
      answer = String(card.res);
      qDiv.innerHTML = `<span>${card.sym} &times; ${card.n} =</span> ${box(answer)}`;
    } else if (card.format === 'sequence') {
      const bi = (card.blank === undefined) ? 3 : card.blank;
      answer = String(card.terms[bi]);
      const parts = card.terms.map((t, i) => i === bi ? null : formatNum(t));
      let html = '';
      parts.forEach((p, i) => {
        const last = i === parts.length - 1;
        if (p === null) html += box(answer) + (last ? '' : '<span>,</span> ');
        else html += `<span>${p}${last ? '' : ','}</span> `;
      });
      qDiv.innerHTML = html.trim();
    } else {
      let styledOp = getColoredOp(card.op);
      answer = String(card.res);
      qDiv.innerHTML = `<span>${formatNum(card.a)} ${styledOp} ${formatNum(card.b)} =</span> ${box(answer)}`;
    }
    grid.appendChild(qDiv);
  }

  /* stars: rated from the questions actually drawn, not from the toggles.
     A sheet of plain single-digit sums sits at 1. Six is reachable several
     ways - hard formats, blanks in awkward places, answers below zero - and
     is not reachable by making the numbers big alone, which tops out near 3. */
  /* Rated across the whole deck the settings produce, not the twenty that
     happened to be drawn. Otherwise the same settings score 5 stars on one
     sheet and 6 on the next, and an inconsistent reward is worse than a
     slightly wrong one. */
  const scored = scoreDeck(deck);
  const meanDiff = scored.score;
  sheetVariety = scored.kinds;
  let earnedStars = starsFromScore(meanDiff);
  sheetDifficulty = meanDiff;

  let starHTML = '';
  for (let s = 1; s <= 6; s++) {
    const boss = (s === 6);
    const state = earnedStars >= s ? 'full' : earnedStars >= s - 0.5 ? 'half' : 'empty';
    starHTML += starSVG(state, boss, s);
  }
  document.getElementById('starRating').innerHTML = starHTML;

  applyHeader();
  applySigns();
  applyShowAnswers();
  sheetStars = earnedStars;
  renderTrick();
  renderTeacherTricks();
  renderDifficulty(earnedStars, selectedQuestions.length);

  const graphicEl = document.getElementById('cornerGraphic');
  if (graphicEl && CORNER_GRAPHICS.length > 0) {
    graphicEl.src = CORNER_GRAPHICS[Math.floor(Math.random() * CORNER_GRAPHICS.length)];
  }

  updateDesign();
  fitPreview();
}

/* The header row is a fixed 34px and always in flow, so showing or hiding a
   field changes nothing else on the page. Regenerating would only throw away
   the questions and the animal for no reason. */
function toggleHeaderField() {
  applyHeader();
  saveState();
}

function applyHeader() {
  const head = document.getElementById('sheetHeader');
  if (!head) return;
  const nameOn = !!(document.getElementById('nameToggle') || {}).checked;
  const dateOn = !!(document.getElementById('dateToggle') || {}).checked;

  document.getElementById('headerName').hidden = !nameOn;
  document.getElementById('headerDate').hidden = !dateOn;
  // whichever field is left on its own sits centred at the top
  head.classList.toggle('centre-one', nameOn !== dateOn);
  // the row itself never leaves the flow, so nothing below it moves
  head.hidden = false;
}

function applyShowAnswers() {
  const el = document.getElementById('showAnswersToggle');
  const content = document.querySelector('.content');
  if (content) content.classList.toggle('show-answers', !!(el && el.checked));
}

function renderTeacherTricks() {
  const list = document.getElementById('teacherTricks');
  if (!list) return;
  const langEl = document.getElementById('langInput');
  const lang = langEl ? langEl.value : DEFAULT_LANG;
  const pool = applicableTricks();

  list.innerHTML = pool.map(t => {
    const isOn = currentTrick && t.id === currentTrick.id;
    const isPinned = pinnedHintId === t.id;
    return `<li><button type="button" class="tricklist-item${isOn ? ' on-sheet' : ''}${isPinned ? ' pinned' : ''}"
      onclick="pinHint('${t.id}')" aria-pressed="${isPinned}">${hintText(t, lang)}</button></li>`;
  }).join('');

  const count = document.getElementById('teacherTrickCount');
  if (count) count.textContent = pool.length;

}

/* Hiding or showing the hint changes the footer height, so the type has to be
   refitted - but the questions and the animal are left exactly as they are. */
let batchRunning = false;

async function runBatch() {
  if (batchRunning) return;
  const from = parseFloat(document.getElementById('batchFrom').value);
  const to = parseFloat(document.getElementById('batchTo').value);
  const count = parseInt(document.getElementById('batchCount').value, 10);
  const status = document.getElementById('batchStatus');
  const btn = document.getElementById('batchRun');
  const say = t => { if (status) status.textContent = t; };

  if (!(count > 0) || Number.isNaN(from) || Number.isNaN(to)) { say('Check the numbers.'); return; }
  const lo = Math.min(from, to), hi = Math.max(from, to);

  batchRunning = true;
  if (btn) btn.disabled = true;

  // everything the batch touches, put back afterwards whatever happens
  const savedT = { ...activeToggles };
  const savedL = { ...opLevel };
  const savedShow = document.getElementById('showAnswersToggle').checked;

  try {
    say('Looking for combinations...');
    await new Promise(r => setTimeout(r, 20));
    const selection = currentSelection();      // read before anything is touched
    const catalogue = buildCatalogue(selection);
    if (!catalogue.length) {
      say('Nothing workable from the types you have switched on at these number ranges.');
      return;
    }

    // targets spread evenly across the range, snapped to halves
    const targets = [];
    for (let i = 0; i < count; i++) {
      const t = count === 1 ? (lo + hi) / 2 : lo + (hi - lo) * (i / (count - 1));
      targets.push(Math.round(t * 2) / 2);
    }

    const usedKeys = new Set();
    const usedTypes = new Set();
    const achieved = [];
    const files = [];
    const missed = new Set();

    for (let i = 0; i < targets.length; i++) {
      const want = targets[i];
      say(`Sheet ${i + 1} of ${targets.length}...`);
      await new Promise(r => setTimeout(r, 0));

      // prefer an exact hit not used yet, then any exact hit, then the nearest
      let pool = catalogue.filter(c => c.stars === want && !usedKeys.has(c.key));
      if (!pool.length) pool = catalogue.filter(c => c.stars === want);
      if (!pool.length) {
        missed.add(want);
        let best = Infinity;
        catalogue.forEach(c => { best = Math.min(best, Math.abs(c.stars - want)); });
        pool = catalogue.filter(c => Math.abs(c.stars - want) === best);
      }

      /* Among everything that hits the target, favour whatever brings in kinds
         of exercise this batch has not used yet. Picking at random gave twelve
         sheets that were mostly the same four operations, because the common
         combinations are common. */
      const typesOf = c => Object.keys(c.toggles)
        .concat(c.levels.comp ? ['comp' + c.levels.comp] : [])
        .concat(c.levels.seq ? ['seq' + c.levels.seq] : []);
      let bestNew = -1;
      const scored = pool.map(c => {
        const fresh = typesOf(c).filter(t => !usedTypes.has(t)).length;
        if (fresh > bestNew) bestNew = fresh;
        return { c, fresh };
      });
      const shortlist = scored.filter(x => x.fresh === bestNew).map(x => x.c);
      const pick = shortlist[Math.floor(Math.random() * shortlist.length)];
      usedKeys.add(pick.key);
      typesOf(pick).forEach(t => usedTypes.add(t));

      Object.keys(activeToggles).forEach(k => activeToggles[k] = false);
      Object.keys(opLevel).forEach(k => opLevel[k] = 0);
      Object.assign(activeToggles, pick.toggles);
      Object.assign(opLevel, pick.levels);
      applyLevels();
      syncToggleButtons();
      document.getElementById('showAnswersToggle').checked = false;
      generateSheet();
      await new Promise(r => setTimeout(r, 0));

      const blob = await captureSheet();
      achieved.push(sheetStars);
      const stars = sheetStars.toFixed(1);
      files.push({ name: `star-${stars}-${String(i + 1).padStart(2, '0')}.png`,
                   data: new Uint8Array(await blob.arrayBuffer()) });
    }

    say('Packing...');
    await new Promise(r => setTimeout(r, 0));
    const zip = makeZip(files);
    const url = URL.createObjectURL(new Blob([zip], { type: 'application/zip' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'math-sheets.zip';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);

    /* Say what was actually produced, not just how many. When a batch comes out
       lower than asked for, this line is the whole diagnosis. */
    const got = achieved.map(v => v.toFixed(1)).join(', ');
    const range = `${Math.min(...achieved).toFixed(1)} to ${Math.max(...achieved).toFixed(1)}`;
    say(missed.size
      ? `${files.length} sheets saved, ${range} stars: ${got}. Asked for ${[...missed].sort((x, y) => x - y).map(v => v.toFixed(1)).join(', ')} but could not reach it at these settings - the nearest was used.`
      : `${files.length} sheets saved, ${range} stars: ${got}.`);
  } catch (err) {
    log('mathsheets: batch failed.', err);
    say('Batch failed: ' + ((err && err.message) || err));
  } finally {
    Object.assign(activeToggles, savedT);
    Object.assign(opLevel, savedL);
    applyLevels();
    syncToggleButtons();
    document.getElementById('showAnswersToggle').checked = savedShow;
    generateSheet();
    batchRunning = false;
    if (btn) btn.disabled = false;
  }
}

/* Shared by the single save and the batch, so they cannot drift apart. */
function captureSheet() {
  const page = document.getElementById('printableArea');
  const frame = document.getElementById('pageFrame');
  const prevTransform = page.style.transform;
  const prevW = frame.style.width, prevH = frame.style.height;
  page.style.transform = 'none';
  frame.style.width = page.offsetWidth + 'px';
  frame.style.height = page.offsetHeight + 'px';

  const restore = () => {
    page.style.transform = prevTransform;
    frame.style.width = prevW;
    frame.style.height = prevH;
    fitPreview();
  };

  return html2canvas(page, { scale: exportScale, useCORS: true, backgroundColor: null })
    .then(canvas => new Promise(res => {
      restore();
      canvas.toBlob(b => res(b), 'image/png');
    }))
    .catch(err => { restore(); throw err; });
}

function toggleTrick() {
  renderTrick();
  renderTeacherTricks();
  fitQuestions();
  fitPreview();
  saveState();
}

function renderTrick() {
  const box = document.getElementById('trickBox');
  if (!box) return;
  const on = document.getElementById('trickToggle');
  if (on && !on.checked) { box.hidden = true; currentTrick = null; return; }

  const pool = applicableTricks();
  if (pool.length === 0) { box.hidden = true; currentTrick = null; return; }

  // A pinned hint wins, but only while it still applies to the sheet.
  // If the operations change out from under it, the pin quietly lapses
  // rather than showing a hint about division on an addition sheet.
  const pinned = pinnedHintId ? pool.find(h => h.id === pinnedHintId) : null;
  if (pinnedHintId && !pinned) pinnedHintId = null;

  currentTrick = pinned || pool[Math.floor(Math.random() * pool.length)];

  const langEl = document.getElementById('langInput');
  const lang = langEl ? langEl.value : DEFAULT_LANG;
  const d = i18n[lang];

  document.getElementById('trickLabel').textContent = d ? d.ui_trick : 'Trick';
  document.getElementById('trickText').textContent = hintText(currentTrick, lang);
  box.hidden = false;
}

function pinHint(id) {
  const releasing = (pinnedHintId === id);
  pinnedHintId = releasing ? null : id;
  // Releasing a pin only stops it being held; it does not ask for a new hint.
  // The sheet keeps what it is showing until the next Generate.
  if (!releasing) { renderTrick(); fitQuestions(); }
  renderTeacherTricks();
  saveState();
}

function renderDifficulty(stars, count) {
  const num = document.getElementById('difficultyScore');
  if (num) num.textContent = sheetDifficulty.toFixed(2) + ' \u00b7 ' + sheetVariety + ' kinds';

  const corner = document.getElementById('scoreReadout');
  if (corner) {
    const langEl = document.getElementById('langInput');
    const dd = i18n[langEl ? langEl.value : DEFAULT_LANG];
    const kindWord = sheetVariety === 1
      ? ((dd && dd.ui_kind) ? dd.ui_kind : 'kind')
      : ((dd && dd.ui_kinds) ? dd.ui_kinds : 'kinds');
    corner.textContent = sheetDifficulty.toFixed(2) + ' \u00b7 ' + stars + ' \u2605 \u00b7 '
                       + sheetVariety + ' ' + kindWord;
  }
  const bar = document.getElementById('difficultyBar');
  if (bar) {
    let html = '';
    for (let s = 1; s <= 6; s++) {
      let cls = 'dpip';
      if (s === 6) cls += ' boss';
      if (stars >= s) cls += ' on';
      else if (stars >= s - 0.5) cls += ' half';
      html += `<span class="${cls}"></span>`;
    }
    bar.innerHTML = html;
  }
  const cnt = document.getElementById('questionCount');
  if (cnt) {
    const langEl = document.getElementById('langInput');
    const d = i18n[langEl ? langEl.value : DEFAULT_LANG];
    cnt.textContent = count + ' ' + (d ? d.q_count : 'questions');
  }
}

function randomizeSheet() {
  let anyActive = false;
  OPS.forEach(o => {
    if (o.levels) {
      opLevel[o.key] = Math.floor(Math.random() * (o.levels.length + 1));
      if (opLevel[o.key] > 0) anyActive = true;
    } else {
      activeToggles[o.key] = Math.random() > 0.5;
      if (activeToggles[o.key]) anyActive = true;
    }
  });
  applyLevels();
  if (!anyActive) activeToggles.add = true;
  syncToggleButtons();
  const cs = document.getElementById('colorSignsToggle');
  if (cs) cs.checked = Math.random() > 0.5;
  generateSheet();
}

/* ===========================================================
   8. EXPORT
   The preview is a CSS transform. html2canvas and transforms
   have a bad history together, so the transform is removed for
   the capture and restored afterwards. The exported PNG is
   therefore independent of preview zoom.
   =========================================================== */
function downloadImage() {
  const page = document.getElementById('printableArea');
  const frame = document.getElementById('pageFrame');
  const btn = document.getElementById('btn_save');
  const qbtn = document.getElementById('quick_save');

  const prevTransform = page.style.transform;
  const prevFrameW = frame.style.width;
  const prevFrameH = frame.style.height;

  page.style.transform = 'none';
  frame.style.width = page.offsetWidth + 'px';
  frame.style.height = page.offsetHeight + 'px';
  if (btn) btn.disabled = true;
  if (qbtn) qbtn.disabled = true;

  const restore = () => {
    page.style.transform = prevTransform;
    frame.style.width = prevFrameW;
    frame.style.height = prevFrameH;
    if (btn) btn.disabled = false;
    if (qbtn) qbtn.disabled = false;
    fitPreview();
  };

  html2canvas(page, { scale: exportScale, useCORS: true, backgroundColor: null })
    .then(canvas => {
      restore();
      const nameEl = document.getElementById('exportName');
      const base = (nameEl && nameEl.value.trim()) ? nameEl.value.trim() : 'math_sheet';
      const link = document.createElement('a');
      link.download = base + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    })
    .catch(err => {
      restore();
      log('mathsheets: export failed.', err);
    });
}

/* ===========================================================
   9. BOOT
   =========================================================== */
async function init() {
  try {
    await boot();
  } catch (err) {
    // Whatever failed, the questions matter more than the reason. Draw them,
    // then say what went wrong somewhere the person can actually see it.
    log('mathsheets: startup failed.', err);
    try { generateSheet(); } catch (e) { /* nothing further to try */ }
    showStartupError(err);
  }
}

function showStartupError(err) {
  try {
    const bar = document.getElementById('fitWarn');
    const txt = document.getElementById('fitWarnText');
    if (bar && txt) {
      txt.textContent = 'Startup problem: ' + ((err && err.message) || err);
      bar.hidden = false;
    }
  } catch (e) { /* nothing further to try */ }
}

async function boot() {
  buildPanel();
  const langEl0 = document.getElementById('langInput');
  if (langEl0) langEl0.value = DEFAULT_LANG;   // loadState overrides this if a language was saved

  buildSwatches();
  loadState();

  syncToggleButtons();
  setScale(exportScale);
  setMode(document.documentElement.getAttribute('data-mode') || 'light');
  setContrast(document.documentElement.getAttribute('data-contrast') || 'normal');

  TABS.forEach(t => {
    document.getElementById('tab_' + t.id).classList.toggle('active', t.id === activeTab);
    document.getElementById('pane_' + t.id).classList.toggle('active', t.id === activeTab);
  });

  document.getElementById('collapseBtn').onclick = () => {
    if (isMobile()) closeDrawer(); else setCollapsed(true);
  };
  document.getElementById('scrim').onclick = closeDrawer;
  document.getElementById('quick_generate').onclick = () => generateSheet();
  document.getElementById('quick_save').onclick = () => downloadImage();

  ['minInput','maxInput','answerMinInput','answerMaxInput','lockInput','lockAnswerInput','colorSignsToggle','trickToggle','showAnswersToggle','nameToggle','dateToggle','borderToggle','fontSizeInput','themeInput','fontInput']
    .forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('change', saveState);
    });

  generateSheet();

  fitTabLabels();

  if (window.ResizeObserver) {
    new ResizeObserver(fitPreview).observe(document.getElementById('stage'));
    new ResizeObserver(fitTabLabels).observe(document.getElementById('tabcol'));
  }
  window.addEventListener('resize', () => { fitPreview(); fitTabLabels(); });
  window.addEventListener('orientationchange', () => setTimeout(() => { fitPreview(); fitTabLabels(); }, 220));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitPreview(); fitTabLabels(); });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>

</body>
