:root {
  --paper:        #E9E4DA;
  --paper-deep:   #DDD6C9;
  --ink:          #24221F;
  --rail:         #2B2825;
  --rail-lift:    #34302B;
  --rail-sunk:    #211E1B;
  --rule:         #423D36;
  --rule-soft:    #383430;
  /* Measured against --rail (#2B2825): 12.4, 7.0 and 4.7 to 1.
     The previous dim value was 2.5 to 1, which failed WCAG AA badly and
     was the single worst thing about reading the panel. */
  --on-rail:      #E7E1D6;
  --on-rail-mute: #BDB4A7;
  --on-rail-dim:  #9A9289;

  /* One family: same lightness and chroma across the set, so they read
     as a matched pack of dividers rather than five unrelated colours.
     These are the values actually shown - no brightness filter dims them. */
  --tab-ops:      #A4DF90;
  --tab-num:      #89CDEC;
  --tab-sty:      #F49AB1;
  --tab-exp:      #FBCF60;
  --tab-set:      #C3A3F0;

  --danger:       #D98A7E;   /* 5.4:1 on the rail; the old #C4756A was 4.26 */

  --f-ui:   'IBM Plex Sans', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, monospace;

  --rail-w: 344px;
  --tabcol-w: 96px;
  --dur: 260ms;
  --ease: cubic-bezier(.4,.14,.3,1);
}

/* High contrast: deepen the surfaces, lift the ink, strengthen the rules.
   Applies in both light and dark, since the rail is charcoal either way.
   Measured floor after this: 8.8 to 1 on the faintest text in the panel. */
html[data-contrast="high"] {
  --rail:         #1E1B18;
  --rail-lift:    #2C2823;
  --rail-sunk:    #141210;
  --rule:         #5C5449;
  --rule-soft:    #4B443A;
  --on-rail:      #FFFFFF;
  --on-rail-mute: #DCD3C5;
  --on-rail-dim:  #C2B9AB;
  --danger:       #F0A093;
}
html[data-contrast="high"] .field-note,
html[data-contrast="high"] .pane-note,
html[data-contrast="high"] .legend-row,
html[data-contrast="high"] .switch-sub { font-size: 12.5px; }
html[data-contrast="high"] .field-label,
html[data-contrast="high"] .panel-box-label { font-size: 10.5px; }
html[data-contrast="high"] .tab { font-size: 10.5px; letter-spacing: .05em; }
html[data-contrast="high"] input,
html[data-contrast="high"] select { border-width: 1.5px; }

html[data-mode="dark"] {
  --paper:      #171614;
  --paper-deep: #100F0E;
  --ink:        #E7E1D6;
  --rail:       #201E1B;
  --rail-lift:  #2A2724;
  --rail-sunk:  #171614;
  --rule:       #3A352F;
  --rule-soft:  #2F2B27;
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  font-family: var(--f-ui);
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* ===========================================================
   SHELL
   =========================================================== */
.app {
  display: flex;
  height: 100dvh;
  width: 100%;
}

.stage {
  flex: 1 1 auto;
  min-width: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
  overflow: hidden;
}
/* only when the sheet is fitted to width and is taller than the stage */
.stage.scrolling {
  overflow-y: auto;
  align-items: flex-start;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(0,0,0,.05), transparent 62%),
    var(--paper);
}

.stage::after {
  /* faint ruled-desk texture, barely there */
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: linear-gradient(var(--paper-deep) 1px, transparent 1px);
  background-size: 100% 34px;
  opacity: .28;
}

.page-frame {
  position: relative;
  flex: 0 0 auto;
  z-index: 1;
  filter: drop-shadow(0 10px 26px rgba(0,0,0,.26));
}

.stage-meta,
.stage-score {
  position: absolute;
  bottom: 12px;
  z-index: 2;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink);
  opacity: .38;
  pointer-events: none;
}
.stage-meta  { left: 16px; }
.stage-score { right: 16px; text-align: right; }

/* ===========================================================
   BINDER
   Dividers stacked on the right of the window. Their tabs stick
   out to the LEFT, into the paper stage, the way a real index
   divider's tab protrudes past the sheet it belongs to.
   Growth is vertical, so a tenth topic costs no width at all.
   =========================================================== */
.binder {
  flex: 0 0 auto;
  display: flex;
  flex-direction: row;
  position: relative;
  z-index: 5;
}

/* --- the tabs --- */
.tabcol {
  flex: 0 0 var(--tabcol-w);
  width: var(--tabcol-w);
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 14px 0 14px 0;
  background: transparent;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  z-index: 2;
}
.tabcol::-webkit-scrollbar { display: none; }

.tab {
  flex: 1 1 0;
  min-height: 38px;
  max-height: 190px;
  width: 100%;
  appearance: none;
  border: 0;
  cursor: pointer;
  position: relative;
  background: var(--tabc);
  color: #201D1A;
  border-radius: 10px 0 0 10px;
  padding: 6px 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: var(--f-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .07em;
  line-height: 1.25;
  text-transform: uppercase;
  white-space: normal;
  overflow-wrap: anywhere;
  overflow: hidden;
  /* Inactive tabs keep their true colour. Depth is carried by position and
     shadow only - dimming three of four tabs meant the palette on screen was
     never the palette that was chosen. */
  opacity: .92;
  transform: translateX(11px);
  box-shadow: inset -11px 0 13px -9px rgba(0,0,0,.30);
  transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease),
              box-shadow var(--dur) var(--ease);
}

.tab:hover { transform: translateX(5px); opacity: 1; }

.tab.active {
  transform: translateX(0);
  opacity: 1;
  box-shadow: -3px 0 14px rgba(0,0,0,.26);
  z-index: 3;
}

/* the active tab merges into the divider body behind it */
.tab.active::after {
  content: '';
  position: absolute;
  right: -4px;
  top: 0; bottom: 0;
  width: 8px;
  background: var(--tabc);
}

.tab:focus-visible { outline: 2px solid var(--on-rail); outline-offset: -4px; }

.tab-code { display: none; }
.tab.compact .tab-name { display: none; }
.tab.compact .tab-code { display: block; }

/* --- the divider body --- */
.rail {
  flex: 0 0 var(--rail-w);
  width: var(--rail-w);
  display: flex;
  flex-direction: column;
  background: var(--rail);
  border-left: 1px solid var(--rule);
  overflow: hidden;
  transition: flex-basis var(--dur) var(--ease), width var(--dur) var(--ease),
              opacity var(--dur) var(--ease);
}

.app.collapsed .rail {
  flex-basis: 0;
  width: 0;
  opacity: 0;
  border-left-width: 0;
}
.app.collapsed .tab { transform: translateX(0); }
.app.collapsed .tab:not(.active) { opacity: .82; }

.rail-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  background: var(--rail-sunk);
  border-bottom: 1px solid var(--rule);
}
.rail-mark {
  font-family: var(--f-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--on-rail-mute);
  white-space: nowrap;
}
.rail-ver {
  font-family: var(--f-mono);
  font-size: 9.5px;
  color: var(--on-rail-dim);
  letter-spacing: .1em;
}
.collapse-btn {
  margin-left: auto;
  appearance: none;
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 6px;
  color: var(--on-rail-mute);
  cursor: pointer;
  width: 28px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  transition: all 160ms var(--ease);
  flex: 0 0 auto;
}
.collapse-btn:hover { color: var(--on-rail); border-color: var(--on-rail-dim); }
.collapse-btn:focus-visible { outline: 2px solid var(--tab-set); outline-offset: 2px; }
.collapse-btn svg { width: 13px; height: 13px; }

/* --- panel body --- */
.panel {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px 18px 22px;
  scrollbar-width: thin;
  scrollbar-color: var(--rule) transparent;
}
.panel::-webkit-scrollbar { width: 9px; }
.panel::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 9px; }
.panel::-webkit-scrollbar-track { background: transparent; }

.pane { display: none; }
.pane.active { display: block; animation: paneIn var(--dur) var(--ease); }

@keyframes paneIn {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: none; }
}

.pane-head {
  display: flex;
  align-items: baseline;
  gap: 9px;
  margin: 0 0 18px;
  padding-bottom: 11px;
  border-bottom: 1px solid var(--rule-soft);
}
.pane-title {
  font-family: var(--f-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .17em;
  text-transform: uppercase;
  color: var(--on-rail);
}
.pane-rule {
  flex: 1 1 auto;
  height: 3px;
  border-radius: 3px;
  background: var(--tabc);
  opacity: .55;
}

.subhead {
  font-family: var(--f-mono);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--on-rail-mute);
  margin: 26px 0 12px;
  padding-top: 16px;
  border-top: 1px solid var(--rule-soft);
}

.pane-note {
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--on-rail-dim);
  margin: -8px 0 18px;
}

/* --- fields --- */
/* A field owns its own note. Spacing between blocks comes from the field's
   bottom margin, never from a margin tuned to a note's current line count -
   a note that grows to four lines must push what follows, not overlap it. */
.field { margin-bottom: 19px; }
.range-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.range-pair > .field { margin-bottom: 0; }
.field-note {
  margin: 8px 0 0;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--on-rail-dim);
}
.field:last-child { margin-bottom: 0; }

.field-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--f-mono);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--on-rail-mute);
  margin-bottom: 8px;
}

.field-value {
  margin-left: auto;
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--on-rail);
  font-variant-numeric: tabular-nums;
}

select, input[type="number"], input[type="text"] {
  width: 100%;
  background: var(--rail-sunk);
  border: 1px solid var(--rule);
  border-radius: 6px;
  color: var(--on-rail);
  font-family: var(--f-ui);
  font-size: 13px;
  padding: 9px 10px;
  transition: border-color 160ms var(--ease);
}
select:hover, input[type="number"]:hover, input[type="text"]:hover { border-color: var(--on-rail-dim); }
select:focus, input[type="number"]:focus, input[type="text"]:focus {
  outline: none;
  border-color: var(--tabc);
}
select { cursor: pointer; }
option { background: var(--rail-sunk); color: var(--on-rail); }

input[type="range"] {
  width: 100%;
  appearance: none;
  background: transparent;
  cursor: pointer;
  height: 20px;
  margin: 0;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 3px; background: var(--rule); border-radius: 3px;
}
input[type="range"]::-webkit-slider-thumb {
  appearance: none; width: 15px; height: 15px; border-radius: 50%;
  background: var(--tabc); margin-top: -6px;
  border: 2px solid var(--rail);
}
input[type="range"]::-moz-range-track { height: 3px; background: var(--rule); border-radius: 3px; }
input[type="range"]::-moz-range-thumb {
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--tabc); border: 2px solid var(--rail);
}
input[type="range"]:focus-visible { outline: 2px solid var(--tabc); outline-offset: 4px; border-radius: 4px; }

/* switch */
.switch-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 0;
  cursor: pointer;
  user-select: none;
}
.switch-row + .switch-row { border-top: 1px solid var(--rule-soft); }
.switch {
  flex: 0 0 auto;
  width: 34px; height: 19px;
  border-radius: 19px;
  background: var(--rail-sunk);
  border: 1px solid var(--rule);
  position: relative;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.switch::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: var(--on-rail-dim);
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
}
.switch-row input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch-row input:checked + .switch { background: var(--tabc); border-color: var(--tabc); }
.switch-row input:checked + .switch::after { transform: translateX(15px); background: var(--rail); }
.switch-row input:focus-visible + .switch { outline: 2px solid var(--tabc); outline-offset: 2px; }
/* Both were inline spans, so the sub-line ran on from the label and its
   margin-top did nothing. Block-level is what makes the stack real. */
.switch-text { display: block; font-size: 13px; line-height: 1.3; color: var(--on-rail); }
.switch-sub  { display: block; font-size: 11px; line-height: 1.45; color: var(--on-rail-dim); margin-top: 4px; }

/* operation toggles */
.op-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}
.op {
  appearance: none;
  border: 1px solid var(--rule);
  background: var(--rail-sunk);
  color: var(--on-rail-dim);
  border-radius: 8px;
  height: 46px;
  font-family: var(--f-mono);
  font-size: 17px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 160ms var(--ease);
  padding: 0;
}
.op:hover { border-color: var(--on-rail-dim); color: var(--on-rail-mute); }
.op.wide { grid-column: span 2; font-size: 13px; letter-spacing: .06em; }
.op.active {
  background: var(--opc);
  border-color: var(--opc);
  color: #1B1917;
  font-weight: 600;
}
.op:focus-visible { outline: 2px solid var(--tab-ops); outline-offset: 2px; }
.op.levelled { flex-direction: column; gap: 4px; padding-top: 4px; }
.op-glyph { line-height: 1; }
.op-pips { display: flex; gap: 3px; }
.op-pip {
  width: 5px; height: 5px; border-radius: 50%;
  background: currentColor; opacity: .22;
  transition: opacity 140ms var(--ease);
}
.op-pip.on { opacity: 1; }

.op-legend { display: grid; gap: 6px; }
.legend-row {
  display: grid;
  grid-template-columns: 22px 1fr;
  gap: 9px;
  align-items: baseline;
  font-size: 11px;
  color: var(--on-rail-dim);
  line-height: 1.4;
}
.legend-key {
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--on-rail-mute);
  text-align: center;
}

/* boxed readouts in the panel */
.panel-box {
  margin-top: 16px;
  padding: 13px 14px;
  background: var(--rail-sunk);
  border: 1px solid var(--rule-soft);
  border-radius: 8px;
}
.panel-box-label {
  font-family: var(--f-mono);
  font-size: 9.5px;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--on-rail-mute);
  margin-bottom: 9px;
}
.difficulty-bar { display: flex; gap: 5px; }
.dpip {
  flex: 1 1 0;
  height: 5px;
  border-radius: 5px;
  background: var(--rule);
  transition: background var(--dur) var(--ease);
}
.dpip.on { background: var(--tab-ops); }
.dpip.half { background: linear-gradient(90deg, var(--tab-ops) 50%, var(--rule) 50%); }
.dpip.boss.on { background: var(--danger); }
.difficulty-count {
  margin-top: 8px;
  font-family: var(--f-mono);
  font-size: 10.5px;
  color: var(--on-rail-dim);
  font-variant-numeric: tabular-nums;
}

/* teacher trick list */
.tricklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.tricklist li { margin: 0; }
.tricklist-item {
  display: block;
  width: 100%;
  text-align: left;
  appearance: none;
  background: transparent;
  font-family: var(--f-ui);
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--on-rail-dim);
  padding: 4px 4px 4px 12px;
  border: 0;
  /* the border and weight never change between states - only their colour.
     Anything that alters the text box reflows the sentence and makes the
     whole list jump when a hint is selected. */
  border-left: 4px solid var(--rule);
  border-radius: 0 5px 5px 0;
  font-weight: 400;
  cursor: pointer;
  transition: color 140ms var(--ease), background 140ms var(--ease), border-color 140ms var(--ease);
}
.tricklist-item:hover { color: var(--on-rail); background: rgba(255,255,255,.05); }
.tricklist-item:focus-visible { outline: 2px solid var(--tab-exp); outline-offset: -2px; }
.tricklist-item.on-sheet { color: var(--on-rail); border-left-color: var(--tab-exp); }
.tricklist-item.pinned {
  color: var(--on-rail);
  border-left-color: var(--tab-exp);
  background: rgba(251,207,96,.12);
}
.count-pill {
  font-family: var(--f-mono);
  font-size: 9.5px;
  color: var(--rail);
  background: var(--on-rail-mute);
  border-radius: 20px;
  padding: 1px 6px;
  margin-left: 4px;
}

/* theme swatches */
.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.swatch {
  appearance: none;
  border: 1px solid var(--rule);
  border-radius: 7px;
  height: 34px;
  cursor: pointer;
  padding: 0;
  position: relative;
  transition: transform 140ms var(--ease), border-color 140ms var(--ease);
}
.swatch:hover { transform: translateY(-2px); }
.swatch.active { border-color: var(--on-rail); }
.swatch.active::after {
  content: '';
  position: absolute;
  inset: 3px;
  border: 2px solid var(--rail);
  border-radius: 4px;
}
.swatch:focus-visible { outline: 2px solid var(--tab-sty); outline-offset: 2px; }

/* segmented */
.seg { display: flex; background: var(--rail-sunk); border: 1px solid var(--rule); border-radius: 7px; padding: 3px; gap: 3px; }
.seg button {
  flex: 1 1 0;
  appearance: none; border: 0; cursor: pointer;
  background: transparent;
  color: var(--on-rail-mute);
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 8px 4px;
  border-radius: 5px;
  transition: all 160ms var(--ease);
}
.seg button.active { background: var(--tabc); color: #1B1917; font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--tabc); outline-offset: -2px; }

.flags { display: flex; gap: 7px; margin-top: 9px; }
.flags svg { border-radius: 2px; box-shadow: 0 0 0 1px var(--rule); display: block; }

.linkbtn {
  appearance: none; background: none; border: 0; cursor: pointer;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--danger);
  padding: 4px 0;
}
.linkbtn:hover { text-decoration: underline; }

/* --- autofit warning --- */
.warn {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 11px 14px;
  background: rgba(251, 207, 98, .12);
  border-top: 1px solid var(--rule);
  border-left: 3px solid var(--tab-exp);
  color: var(--tab-exp);
  font-size: 11.5px;
  line-height: 1.4;
}
.warn[hidden] { display: none; }
.warn svg { flex: 0 0 auto; width: 15px; height: 15px; margin-top: 1px; }

/* --- actions --- */
.actions {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 13px 14px;
  background: var(--rail-sunk);
  border-top: 1px solid var(--rule);
}
.btn {
  appearance: none;
  border: 1px solid var(--rule);
  background: var(--rail-lift);
  color: var(--on-rail);
  border-radius: 7px;
  padding: 11px 8px;
  font-family: var(--f-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .11em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 160ms var(--ease);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.btn:hover { background: var(--rule); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--tab-set); outline-offset: 2px; }
.btn.primary {
  grid-column: span 2;
  background: var(--on-rail);
  color: var(--rail);
  border-color: var(--on-rail);
  font-weight: 600;
}
.btn.primary:hover { background: #fff; }
.btn[disabled] { opacity: .5; cursor: wait; }

/* quick actions that live in the tab column on mobile */
.quickbar { display: none; }

/* mobile scrim */
.scrim {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 4;
  opacity: 0;
  transition: opacity var(--dur) var(--ease);
}

/* ===========================================================
   THE SHEET  (unchanged visual contract)
   =========================================================== */
.page {
  width: 210mm;
  height: 296.5mm;
  position: absolute;
  top: 0; left: 0;
  transform-origin: top left;
  overflow: hidden;
  background: linear-gradient(to bottom right, #1e90ff, #ff69b4, #ffff00);
  padding: 15px;
  border-radius: 2px;
}
.content {
  background: white;
  color: #000;
  width: 100%; height: 100%;
  /* 20mm on three sides, 7mm at the foot. The stars used to sit a full 20mm
     above the coloured border, which was the wasted space - not the stars. */
  padding: 20mm 20mm 7mm;
  display: flex;
  flex-direction: column;
  position: relative;
  border-radius: 4px;
}
.unicorn {
  position: absolute;
  top: 10px; right: 10px;
  width: 100px; height: 100px;
  object-fit: contain;
}
.header-field[hidden] { display: none; }
/* The header row is always in flow at a fixed height, so switching the name
   or the date off never lifts the questions into it. Only the fields inside
   are hidden. */
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  font-size: 24px;
  font-weight: bold;
  height: 34px;
  margin-bottom: 26px;
  width: 100%;
  flex: 0 0 auto;
}
.header.centre-one { justify-content: center; }
.header-field { display: flex; align-items: flex-end; width: 45%; }
.header-line { flex-grow: 1; border-bottom: 2px solid #000; margin-left: 10px; height: 1.2em; }
.grid {
  display: grid;
  /* minmax(0,1fr) not 1fr: a bare 1fr track has min-width:auto, so a wide
     question widens its own column and eats the page margin instead of
     being constrained by it. */
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  column-gap: 30px;
  row-gap: calc(var(--qfs, 26px) * 0.92);
  /* was margin: auto 0, which split the spare height between the grid and the
     footer and let the stars drift up as the type shrank. The grid now takes
     the slack and the footer sits flush at the bottom of the page, always. */
  margin: 0;
  align-items: center;
  align-content: center;
  position: relative;
  /* flex:1 makes the grid absorb the spare height so the footer stays pinned
     to the bottom. min-height:0 is required with it: a flex item's automatic
     minimum size is its content, so without this the grid can grow but never
     shrink, and it pushes the footer off the page. */
  flex: 1 1 auto;
  min-height: 0;
}
.grid::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: calc(50% - 1px);
  border-left: 2px solid #000;
}
.question {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(var(--qfs, 26px) * 0.577);
  font-size: var(--qfs, 26px);
  font-weight: bold;
  white-space: nowrap;
  min-width: 0;
}
/* Everything in a question is derived from --qfs so the whole row scales
   together. At 26px these resolve to the v003 values exactly: 90x50 box,
   3px border, 30px pencil, 15px gap. */
.answer-box {
  overflow: visible;
  border: calc(var(--qfs, 26px) * 0.115) solid #000;
  height: calc(var(--qfs, 26px) * 1.923);
  width: calc(var(--qfs, 26px) * 3.462);
  border-radius: calc(var(--qfs, 26px) * 0.308);
  position: relative;
  flex-shrink: 0;
}
.content.signs-on .os-add  { color: #418A28; }
.content.signs-on .os-sub  { color: #D02550; }
.content.signs-on .os-mult { color: #1D81AF; }
.content.signs-on .os-div  { color: #C9940D; }

.answer-fill {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: calc(var(--qfs, 26px) * 0.92);
  font-weight: bold;
  color: #C41E3A;
}
.content.show-answers .answer-fill { display: flex; }
.content.show-answers .pencil-svg { opacity: .25; }

/* The pencil is anchored by its graphite tip, which sits just inside the
   box's top-right corner. The body swings up and to the right from there,
   so the pencil rests on the corner rather than lying over the writing
   space. transform-origin is the tip, so the angle pivots on the point. */
.pencil-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: visible;
}
.pencil-svg {
  position: absolute;
  width: calc(var(--qfs, 26px) * 2.55);
  height: calc(var(--qfs, 26px) * 2.55);
  pointer-events: none;
}
/* Measured: six stars at 105px with 5px letter-spacing occupy ~591px of a
   612px content area, so nothing fits beside them. The trick takes its own
   row above and the autofit absorbs the extra height. */
.sheet-footer {
  margin-top: auto;
  padding-top: 10px;
  display: flex;
  flex-direction: column;
  gap: calc(var(--qfs, 26px) * 0.35);
}
.trick {
  width: 100%;
  min-width: 0;
  display: flex;
  align-items: flex-start;
  gap: calc(var(--qfs, 26px) * 0.34);
}
.trick[hidden] { display: none; }
.trick-icon {
  flex: 0 0 auto;
  width: calc(var(--qfs, 26px) * 0.92);
  height: calc(var(--qfs, 26px) * 0.92);
  margin-top: calc(var(--qfs, 26px) * 0.02);
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.22));
}
.trick-text {
  flex: 1 1 auto;
  min-width: 0;
  font-size: calc(var(--qfs, 26px) * 0.70);
  line-height: 1.30;
  font-weight: bold;
}
.stars {
  flex: 0 0 auto;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  line-height: 1;
  color: #FFD700;
  text-shadow: 2px 2px 4px rgba(0,0,0,.2);
  letter-spacing: 5px;
}

/* ===========================================================
   MOBILE
   Same binder, same grammar. The tab column stays pinned to the
   right edge of the screen at full height, so the number of
   dividers is limited by screen height, not by width. The body
   slides out over the sheet instead of sitting beside it.
   =========================================================== */
@media (max-width: 900px) {
  :root { --tabcol-w: 78px; }
  .stage { padding: 12px calc(var(--tabcol-w) + 8px) 12px 12px; }
  .stage-meta  { left: 12px; bottom: 8px; }
  .stage-score { right: calc(var(--tabcol-w) + 12px); bottom: 8px; }

  .binder {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    height: 100dvh;
    align-items: stretch;
    flex-direction: row-reverse;
  }

  .tabcol {
    padding: calc(10px + env(safe-area-inset-top)) 0 calc(10px + env(safe-area-inset-bottom)) 0;
    background: var(--rail-sunk);
    border-left: 1px solid var(--rule);
    z-index: 3;
  }

  .tab { border-radius: 9px 0 0 9px; }

  .rail {
    position: absolute;
    top: 0; bottom: 0;
    right: var(--tabcol-w);
    width: min(300px, 68vw);
    flex-basis: auto;
    transform: translateX(calc(100% + var(--tabcol-w)));
    opacity: 1;
    box-shadow: -12px 0 34px rgba(0,0,0,.4);
    transition: transform var(--dur) var(--ease);
  }
  .binder.open .rail { transform: translateX(0); }

  .app.collapsed .rail { width: min(300px, 68vw); flex-basis: auto; opacity: 1; border-left-width: 1px; }

  .rail-head { display: flex; }

  /* generate + save stay reachable without opening a divider */
  .quickbar {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding-top: 9px;
    margin-top: 5px;
    border-top: 1px solid var(--rule);
    flex: 0 0 auto;
  }
  .quick {
    appearance: none;
    border: 1px solid var(--rule);
    background: var(--rail-lift);
    color: var(--on-rail);
    border-radius: 8px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .quick svg { width: 17px; height: 17px; }
  .quick:active { transform: translateY(1px); }
  .quick[disabled] { opacity: .5; }

  .scrim.on { display: block; opacity: 1; }
}

@media (max-width: 900px) and (orientation: landscape) {
  .tab { min-height: 32px; font-size: 8.5px; letter-spacing: .04em; padding: 4px 6px; }
}

</style>
</head>
<body>

   1. CONFIG  -  the dividers.
   Add a topic later by appending an object here. Nothing in
   the render code needs to know what a tab contains.
   =========================================================== */
const TABS = [
  { id: 'ops',  code: 'OP', name: 'Operations', colour: 'var(--tab-ops)' },
  { id: 'num',  code: 'NB', name: 'Numbers',    colour: 'var(--tab-num)' },
  { id: 'sty',  code: 'ST', name: 'Style',      colour: 'var(--tab-sty)' },
  { id: 'tch',  code: 'TE', name: 'Teacher',    colour: 'var(--tab-exp)' },
  { id: 'set',  code: 'SE', name: 'Settings',   colour: 'var(--tab-set)' }
];

/* A button with `levels` cycles off -> level 1 -> level 2 -> off.
   `levels` lists the internal flag raised at each level, so the deck code
   below never learns about levels at all. Comparison was already expressed
   as two separate buttons; it now uses the same idiom as sequences. */
const OPS = [
  { key: 'add',    glyph: '+',        colour: '#A4DF90', wide: false },
  { key: 'sub',    glyph: '&minus;',  colour: '#F49AB1', wide: false },
  { key: 'mult',   glyph: '&times;',  colour: '#89CDEC', wide: false },
  { key: 'div',    glyph: '&divide;', colour: '#FBCF60', wide: false },
  { key: 'alg',    glyph: '[ ]',      colour: '#C3A3F0', wide: false },
  { key: 'missop', glyph: '[ ? ]',    colour: '#F0B27A', wide: false },
  { key: 'comp',   glyph: '&lt; = &gt;', colour: '#7FE0CC', wide: false,
    levels: ['comp', 'comp_hard'] },
  { key: 'seq',    glyph: '2 4 ?',    colour: '#A8C8F0', wide: false,
    levels: ['seq', 'seq_hard'] },
  { key: 'balance',   glyph: '=&nbsp;?',  colour: '#E8A0C8', wide: false },
  { key: 'partition', glyph: '40+?',      colour: '#9FD8B0', wide: false },
  { key: 'fracof',    glyph: '\u00bd of', colour: '#D8C08A', wide: false }
];

const activeToggles = { add: true, sub: false, mult: false, div: false, alg: false,
                        comp: false, comp_hard: false, missop: false,
                        seq: false, seq_hard: false,
                        balance: false, partition: false, fracof: false };

// 0 = off, 1 = first level, 2 = second. Only for OPS entries carrying `levels`.
const opLevel = { comp: 0, seq: 0 };

function applyLevels() {
  OPS.filter(o => o.levels).forEach(o => {
    o.levels.forEach((flag, i) => { activeToggles[flag] = (opLevel[o.key] === i + 1); });
  });
}

/* ===========================================================
   HINTS
   The real set lives in hints.json next to this file, so a hint can be
   added without touching the build. The list below is only a safety net
   for when that file cannot be read - if it is ever in use, the Teacher
   divider says so out loud rather than pretending nothing happened.
   Schema: { id, ops: [...], text, fr?, nl? }
   'text' is required. fr and nl are optional overrides.
   =========================================================== */


/* Every hint, all three languages, baked in. This is the working set: the
   sheet is fully functional opened straight from disk, with no server and no
   fetch. json/hints.json is kept in step with it and is loaded when it can be
   reached, so editing that file on localhost still works without a rebuild.
   A test asserts the two are identical, so they cannot drift apart. */
/* Not every host provides the whole console object. Some sandboxes have no
   console.info, and calling it from inside a catch block throws a second error
   out of the error handler, which took a whole build down once. Logging must
   never be able to do that. */
function log(msg, extra) {
  try {
    const fn = (console && (console.info || console.log || console.warn)) || null;
    if (fn) fn.call(console, msg, extra === undefined ? '' : extra);
  } catch (e) { /* logging is never worth an exception */ }
}

function hintText(h, lang) {
  if (!h) return '';
  const key = lang === 'french' ? 'fr' : lang === 'dutch' ? 'nl' : null;
  return (key && h[key]) || h.text || h.en || '';
}

function applicableTricks() {
  const active = Object.keys(activeToggles).filter(k => activeToggles[k]);
  if (active.length === 0) active.push('add');
  return TRICKS.filter(t => t.ops.includes('any') || t.ops.some(o => active.includes(o)));
}

/* Delivered as a data-URI image with the tilt baked into the SVG itself.
   html2canvas would not render this as an inline <svg> positioned outside the
   element it decorates - the pencil simply never reached the PNG. An <img>
   with no CSS transform is the one form it handles the same way the browser
   does, so what is on screen is what gets saved. */
/* Stars are drawn, not typed. A Unicode glyph is whatever shape the system
   font happens to have, and it rasterises differently again on export. Every
   root carries explicit width and height, for the same reason the pencil does.
   Gradient ids are per-star: six copies of one id and they all resolve to the
   first, so five stars would render flat. */
const STAR_PATH = 'M50 6c2 0 3.7 1.2 4.5 3l9 22.4c.7 1.7 2.2 2.8 4 2.9l24.2 1.5c4.3.3 6 5.7 2.7 8.4'
  + 'L75.6 61.6c-1.4 1.1-2 3-1.6 4.7l5.9 23.5c1 4.1-3.5 7.4-7.2 5.2L52.4 82.2c-1.5-.9-3.3-.9-4.8 0'
  + 'L27 95c-3.7 2.2-8.2-1.1-7.2-5.2l5.9-23.5c.4-1.7-.2-3.6-1.6-4.7L5.2 45.2c-3.3-2.7-1.6-8.1 2.7-8.4'
  + 'L32.1 35.3c1.8-.1 3.3-1.2 4-2.9l9-22.4C45.9 7.2 47.7 6 50 6Z';

const STAR_SIZE = 88;

function starSVG(state, boss, i) {
  const gid = 'sg' + i, rid = 'sr' + i, cid = 'sc' + i;
  const goldStops = '<stop offset="0" stop-color="#FFE89A"/><stop offset=".45" stop-color="#FFD447"/>'
                  + '<stop offset="1" stop-color="#E9A00C"/>';
  const rubyStops = '<stop offset="0" stop-color="#FF8FA0"/><stop offset=".45" stop-color="#E23A55"/>'
                  + '<stop offset="1" stop-color="#A81733"/>';
  const emptyStroke = boss ? '#D98494' : '#C9C4BC';
  const fillId = boss ? rid : gid;
  const rim = boss ? '#8E1B2E' : '#B8860B';

  const defs = `<defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">${goldStops}</linearGradient>
      <linearGradient id="${rid}" x1="0" y1="0" x2="0" y2="1">${rubyStops}</linearGradient>
      <clipPath id="${cid}"><rect x="0" y="0" width="50" height="100"/></clipPath>
    </defs>`;

  let body;
  if (state === 'empty') {
    body = `<path d="${STAR_PATH}" fill="none" stroke="${emptyStroke}" stroke-width="3.4" stroke-linejoin="round"/>`;
  } else if (state === 'half') {
    body = `<path d="${STAR_PATH}" fill="none" stroke="${emptyStroke}" stroke-width="3.4" stroke-linejoin="round"/>`
         + `<g clip-path="url(#${cid})"><path d="${STAR_PATH}" fill="url(#${fillId})" stroke="${rim}" stroke-width="2.6" stroke-linejoin="round"/></g>`;
  } else {
    body = `<path d="${STAR_PATH}" fill="url(#${fillId})" stroke="${rim}" stroke-width="2.6" stroke-linejoin="round"/>`;
  }
  return `<svg class="star" width="${STAR_SIZE}" height="${STAR_SIZE}" viewBox="0 0 100 100" aria-hidden="true">${defs}${body}</svg>`;
}

/* ===========================================================
   3. PANEL RENDER  -  ids match the originals so the question
   logic below is untouched.
   =========================================================== */
function buildPanel() {
  const col = document.getElementById('tabcol');
  const quickbar = col.querySelector('.quickbar');
  const panel = document.getElementById('panel');
  col.querySelectorAll('.tab').forEach(n => n.remove());
  panel.innerHTML = '';

  TABS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.id = 'tab_' + t.id;
    b.style.setProperty('--tabc', t.colour);
    b.setAttribute('role', 'tab');
    b.title = t.name;
    b.innerHTML = `<span class="tab-name" data-tabname="${t.id}">${t.name}</span><span class="tab-code">${t.code}</span>`;
    b.onclick = () => selectTab(t.id);
    // tabs always sit above the quick actions
    col.insertBefore(b, quickbar);

    const p = document.createElement('div');
    p.className = 'pane';
    p.id = 'pane_' + t.id;
    p.style.setProperty('--tabc', t.colour);
    p.innerHTML = paneHTML(t);
    panel.appendChild(p);
  });
}

/* Labels are horizontal and wrap. Once the stack is deep enough that
   the wrapped name no longer fits its tab's height, that tab falls back
   to its 2-letter code. Measured against the real box, not guessed. */
function fitTabLabels() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('compact');
    const name = tab.querySelector('.tab-name');
    if (!name) return;
    if (name.scrollHeight > tab.clientHeight - 4) tab.classList.add('compact');
  });
}

/* ---- tabs ---- */
let activeTab = 'ops';

function isMobile() { return window.matchMedia('(max-width: 900px)').matches; }

function closeDrawer() {
  document.getElementById('binder').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');
}

function selectTab(id) {
  const binder = document.getElementById('binder');
  const app = document.getElementById('app');

  // tapping the divider you are already on puts it back in the stack
  if (id === activeTab) {
    if (isMobile() && binder.classList.contains('open')) { closeDrawer(); return; }
    if (!isMobile() && !app.classList.contains('collapsed')) { setCollapsed(true); return; }
  }

  activeTab = id;
  TABS.forEach(t => {
    document.getElementById('tab_' + t.id).classList.toggle('active', t.id === id);
    document.getElementById('pane_' + t.id).classList.toggle('active', t.id === id);
  });

  if (isMobile()) {
    binder.classList.add('open');
    document.getElementById('scrim').classList.add('on');
  } else if (app.classList.contains('collapsed')) {
    setCollapsed(false);
  }
  saveState();
}

function setCollapsed(v) {
  document.getElementById('app').classList.toggle('collapsed', v);
  saveState();
  requestAnimationFrame(() => setTimeout(() => { fitPreview(); fitTabLabels(); }, 300));
}

/* ===========================================================
   4. SCALE TO FIT
   Clamps on BOTH axes, so a wide window letterboxes left and
   right, and a narrow one clamps on width instead of spilling.
   =========================================================== */
function fitPreview() {
  const stage = document.getElementById('stage');
  const page = document.getElementById('printableArea');
  const frame = document.getElementById('pageFrame');
  if (!stage || !page || !frame) return;

  // offsetWidth/Height report the untransformed layout box, so this
  // is safe to read while a scale() is already applied.
  const natW = page.offsetWidth;
  const natH = page.offsetHeight;

  // Padding is read from the element, never assumed. The mobile media
  // query pads the stage on the right to clear the tab column, and a
  // hardcoded constant here silently sends the sheet under the tabs.
  const cs = getComputedStyle(stage);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const availW = stage.clientWidth - padX;
  const availH = stage.clientHeight - padY;
  if (natW <= 0 || natH <= 0 || availW <= 0 || availH <= 0) return;

  const kW = availW / natW;
  const kH = availH / natH;
  let k = Math.min(kW, kH);

  /* Fitting to height is right in a normal window and wrong in a short one.
     Embedded in a small frame the height clamp drives the sheet down to a
     tenth of its size - technically visible, practically blank. Below a
     readable floor, fit to width instead and let the stage scroll. */
  const READABLE = 0.5;
  const scrolls = k < READABLE && kW > k;
  if (scrolls) k = Math.min(kW, 1);
  stage.classList.toggle('scrolling', scrolls);

  page.style.transform = 'scale(' + k + ')';
  frame.style.width = (natW * k) + 'px';
  frame.style.height = (natH * k) + 'px';

  const readout = document.getElementById('zoomReadout');
  if (readout) readout.textContent = Math.round(k * 100) + '%';
}

/* ===========================================================
   5. PERSISTENCE
   =========================================================== */
const STORE_KEY = 'mathsheets.v1';

function saveState() {
  try {
    const g = id => { const el = document.getElementById(id); return el ? el.value : null; };
    const c = id => { const el = document.getElementById(id); return el ? el.checked : null; };
    localStorage.setItem(STORE_KEY, JSON.stringify({
      toggles: activeToggles,
      levels: opLevel,
      lang: g('langInput'),
      theme: g('themeInput'),
      font: g('fontInput'),
      fontSize: g('fontSizeInput'),
      border: c('borderToggle'),
      min: g('minInput'),
      max: g('maxInput'),
      answerMin: g('answerMinInput'),
      answerMax: g('answerMaxInput'),
      lock: g('lockInput'),
      lockAnswer: g('lockAnswerInput'),
      colorSigns: c('colorSignsToggle'),
      trick: c('trickToggle'),
      showAnswers: c('showAnswersToggle'),
      batchFrom: g('batchFrom'), batchTo: g('batchTo'), batchCount: g('batchCount'),
      headerName: c('nameToggle'),
      headerDate: c('dateToggle'),
      pinnedHint: pinnedHintId,
      exportScale: exportScale,
      exportName: g('exportName'),
      mode: document.documentElement.getAttribute('data-mode') || 'light',
      contrast: document.documentElement.getAttribute('data-contrast') || 'normal',
      tab: activeTab,
      collapsed: document.getElementById('app').classList.contains('collapsed')
    }));
  } catch (e) {
    log('mathsheets: settings could not be saved.', e);
  }
}

function loadState() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); }
  catch (e) { log('mathsheets: saved settings were unreadable, using defaults.', e); }
  if (!s) return;

  const set = (id, v) => { const el = document.getElementById(id); if (el && v !== null && v !== undefined) el.value = v; };
  const chk = (id, v) => { const el = document.getElementById(id); if (el && typeof v === 'boolean') el.checked = v; };

  if (s.toggles) Object.keys(activeToggles).forEach(k => {
    if (typeof s.toggles[k] === 'boolean') activeToggles[k] = s.toggles[k];
  });
  if (s.levels) Object.keys(opLevel).forEach(k => {
    if (typeof s.levels[k] === 'number') opLevel[k] = s.levels[k];
  });
  applyLevels();
  set('langInput', s.lang); set('themeInput', s.theme); set('fontInput', s.font);
  set('fontSizeInput', s.fontSize); chk('borderToggle', s.border);
  set('minInput', s.min); set('maxInput', s.max);
  set('answerMinInput', s.answerMin); set('answerMaxInput', s.answerMax);
  set('lockInput', s.lock); set('lockAnswerInput', s.lockAnswer); set('exportName', s.exportName);
  chk('colorSignsToggle', s.colorSigns); chk('trickToggle', s.trick); chk('showAnswersToggle', s.showAnswers);
  set('batchFrom', s.batchFrom); set('batchTo', s.batchTo); set('batchCount', s.batchCount); chk('nameToggle', s.headerName); chk('dateToggle', s.headerDate);
  if (typeof s.pinnedHint === 'string') pinnedHintId = s.pinnedHint;

  if (s.exportScale) exportScale = s.exportScale;
  if (s.mode) document.documentElement.setAttribute('data-mode', s.mode);
  if (s.contrast) document.documentElement.setAttribute('data-contrast', s.contrast);
  if (s.tab && TABS.some(t => t.id === s.tab)) activeTab = s.tab;
  if (s.collapsed) document.getElementById('app').classList.add('collapsed');
}

function resetState() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  location.reload();
}

/* ===========================================================
   6. UI STATE SYNC
   =========================================================== */
let exportScale = 2;

function setScale(n) {
  exportScale = n;
  document.querySelectorAll('#scaleSeg button').forEach(b =>
    b.classList.toggle('active', Number(b.dataset.scale) === n));
  saveState();
}

function setContrast(c) {
  document.documentElement.setAttribute('data-contrast', c);
  document.querySelectorAll('#contrastSeg button').forEach(b =>
    b.classList.toggle('active', b.dataset.contrast === c));
  saveState();
  // type sizes shift, so both fits have to be recomputed
  fitTabLabels();
  fitQuestions();
  fitPreview();
}

function setMode(m) {
  document.documentElement.setAttribute('data-mode', m);
  document.querySelectorAll('#modeSeg button').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === m));
  saveState();
}

function onLangChange() {
  updateText();
  generateSheet();
  saveState();
}

function buildSwatches() {
  const wrap = document.getElementById('swatches');
  if (!wrap) return;
  wrap.innerHTML = '';
  themeOrder.forEach(k => {
    const b = document.createElement('button');
    b.className = 'swatch';
    b.dataset.theme = k;
    b.style.background = themes[k];
    b.title = k;
    b.onclick = () => {
      document.getElementById('themeInput').value = k;
      updateDesign();
    };
    wrap.appendChild(b);
  });
}

function syncSwatches() {
  const cur = document.getElementById('themeInput');
  if (!cur) return;
  document.querySelectorAll('#swatches .swatch').forEach(b =>
    b.classList.toggle('active', b.dataset.theme === cur.value));
}

function syncToggleButtons() {
  OPS.forEach(o => {
    const btn = document.getElementById('btn_toggle_' + o.key);
    if (!btn) return;
    if (o.levels) {
      const lv = opLevel[o.key] || 0;
      btn.classList.toggle('active', lv > 0);
      btn.dataset.level = lv;
      const pips = btn.querySelector('.op-pips');
      if (pips) pips.innerHTML = o.levels.map((_, i) =>
        `<span class="op-pip${lv > i ? ' on' : ''}"></span>`).join('');
    } else {
      btn.classList.toggle('active', !!activeToggles[o.key]);
    }
  });
}

function toggleMode(mode) {
  const op = OPS.find(o => o.key === mode);
  if (op && op.levels) {
    opLevel[mode] = (opLevel[mode] + 1) % (op.levels.length + 1);
    applyLevels();
    updateText();
  } else {
    activeToggles[mode] = !activeToggles[mode];
  }
  syncToggleButtons();
  generateSheet();
}

  put('ui_name', d.ui_name); put('ui_name_sub', d.ui_name_sub);
  put('ui_date', d.ui_date); put('ui_date_sub', d.ui_date_sub);
  put('note_pin', d.note_pin);

  // operation buttons carry a name for hover and for screen readers
  OPS.forEach(o => {
    const btn = document.getElementById('btn_toggle_' + o.key);
    if (!btn) return;
    let name = (d.ops && d.ops[o.key]) ? d.ops[o.key] : o.key;
    if (o.levels && d.ops && d.ops.levels) name += ' - ' + d.ops.levels[opLevel[o.key] || 0];
    btn.title = name;
    btn.setAttribute('aria-label', name);
  });
  put('ui_reset', d.ui_reset);
  put('note_ops', d.note_ops); put('note_num', d.note_num); put('note_exp', d.note_exp);

  document.querySelectorAll('[data-tabname]').forEach(el => {

  });
